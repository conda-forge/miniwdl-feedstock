{% set name = "miniwdl" %}
{% set version = "1.13.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: c9c19a469aa76249612da85db1f66bdb96b6dc50cf26021481724aaf2be96673

build:
  noarch: python
  number: 0
  script: '{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv '
  entry_points:
    - miniwdl = WDL.CLI:main

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - setuptools_scm >=6
    - wheel

  run:
    - python >={{ python_min }}
    - setuptools
    - xdg >=5.0.0
    - importlib-metadata >=3.10.1
    - docker-py >=3.4.0
    - regex >=2020.4.4
    - argcomplete >=3,<4
    - coloredlogs >=15,<16
    - pygtail >=0.14.0
    - python-json-logger >=2,<4
    - ruamel.yaml >=0.18
    - questionary >=2,<3
    - lark >=1.3,<1.4
    - psutil >=5,<8

test:
  requires:
    - python {{ python_min }}
  imports:
    - WDL
    - WDL.Env
    - WDL.Error
    - WDL.Expr
    - WDL.StdLib
    - WDL.Tree
    - WDL.Type
    - WDL.Value
    - WDL.Walker
    - WDL.Lint
    - WDL.runtime
    - WDL.runtime.backend
  commands:
    - miniwdl --version

about:
  home: https://github.com/chanzuckerberg/miniwdl
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Developer toolkit for the Workflow Description Language (WDL)
  description: >
    miniwdl provides WDL developer productivity tools, a local runtime implementation, and a foundation for language experimentation.

extra:
  recipe-maintainers:
    - mlin
    - rhpvorderman
