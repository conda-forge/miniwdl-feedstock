{% set name = "miniwdl" %}
{% set version = "1.16.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 121f684373405fce44b8f3100a6e133c4e71e198376f3c024bf9acac39167441

build:
  noarch: python
  number: 0
  script: '{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv '
  entry_points:
    - miniwdl = WDL.CLI:main

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >=61
    - setuptools_scm >=6
    - wheel

  run:
    - python >={{ python_min }}
    - xdg >=5.0.0
    - docker-py >=3.4.0
    - regex >=2020.4.4
    - argcomplete >=3,<4
    - coloredlogs >=15,<16
    - python-json-logger >=3.1,<5
    - ruamel.yaml >=0.19,<0.20
    - questionary >=2,<3
    - lark >=1.3,<2
    - psutil >=5,<8

test:
  requires:
    - python {{ python_min }}
  imports:
    - WDL
    - WDL.Env
    - WDL.Error
    - WDL.Expr
    - WDL.StdLib
    - WDL.Tree
    - WDL.Type
    - WDL.Value
    - WDL.Walker
    - WDL.Lint
    - WDL.runtime
    - WDL.runtime.backend
  commands:
    - miniwdl --version

about:
  home: https://github.com/chanzuckerberg/miniwdl
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Developer toolkit for the Workflow Description Language (WDL)
  description: >
    miniwdl provides WDL developer productivity tools, a local runtime implementation, and a foundation for language experimentation.

extra:
  recipe-maintainers:
    - mlin
    - rhpvorderman
